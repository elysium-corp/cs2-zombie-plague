# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ru-RU"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  review_details: true

  path_filters:
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/output/**"
    - "!**/*.dll"
    - "!**/*.pdb"
    - "!**/*.deps.json"

  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: false
    base_branches:
      - "master"
      - "develop"

  path_instructions:
    - path: "**/*.Api/**/*.cs"
      instructions: |
        Проверяй обратную совместимость публичных контрактов, DTO и событий.
        API-модули не должны зависеть от Core-реализаций или внутренних сервисов.
        Отмечай breaking changes, изменение nullable-контрактов и несовместимые
        изменения shared-интерфейсов.

    - path: "**/*.Core/**/*.cs"
      instructions: |
        Проверяй корректность игрового lifecycle SwiftlyS2, регистрацию сервисов
        в DI, освобождение ресурсов и симметричность подписок/отписок.
        Обращай внимание на утечки обработчиков, повторную регистрацию hooks,
        некорректную работу при reload/unload плагина и прямые зависимости
        одного Core-модуля от внутренних сервисов другого Core-модуля.

    - path: "Common.Di/**/*.cs"
      instructions: |
        Проверяй порядок BuildModule/OnStart/OnReady/OnUnload/DestroyModule/OnStop,
        изоляцию контейнеров по TModule, корректный Dispose ServiceProvider
        и отсутствие доступа к DI до создания или после уничтожения контейнера.

    - path: "**/*.csproj"
      instructions: |
        Проверяй направление project-зависимостей: Api не зависит от Core,
        потребители используют публичные Api-контракты, а общая инфраструктура
        не получает бизнес-зависимости конкретных feature-модулей.
        Отмечай несовместимость с .NET 10 и закреплённой версией SwiftlyS2.

    - path: "**/resources/**"
      instructions: |
        Проверяй согласованность JSON-конфигураций, gamedata, templates
        и локализаций с моделями C#. Отмечай отсутствующие обязательные поля,
        несовместимые переименования и ресурсы, которые не попадут в публикацию.

chat:
  auto_reply: true
