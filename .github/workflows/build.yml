name: Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build:
    name: Build, test and document .NET 10 solution
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET information
        run: dotnet --info

      - name: Build and package server runtime
        shell: pwsh
        run: ./scripts/build-package.ps1 -Configuration Release

      - name: Run tests
        run: |
          dotnet test CS2ZombiePlague.sln \
            --configuration Release \
            --no-build \
            --no-restore

      - name: Verify event documentation
        run: |
          dotnet run \
            --project tools/EventDocsGenerator/EventDocsGenerator.csproj \
            --configuration Release \
            -- check

      - name: Restore documentation tools
        run: dotnet tool restore

      - name: Build DocFX site
        run: dotnet docfx docfx.json

      - name: Create Flute documentation package
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

          mkdir -p artifacts

          dotnet run \
            --project tools/EventDocsGenerator/EventDocsGenerator.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            -- package \
            --output artifacts/documentation.json \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$branch" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"

          jq -e \
            '.schemaVersion == 1 and .catalog.schemaVersion == 1' \
            artifacts/documentation.json >/dev/null

      - name: Inspect generated artifacts
        shell: bash
        run: |
          if [[ ! -f dist/Release/runtime-manifest.json ]]; then
            echo "::error::dist/Release/runtime-manifest.json does not exist"
            exit 1
          fi

          if [[ ! -f dist/Release/packages/Elysium.Runtime.Release.zip ]]; then
            echo "::error::full runtime archive does not exist"
            exit 1
          fi

          jq -e '
            .schemaVersion == 1 and
            .configuration == "Release" and
            .pluginCount > 0 and
            .fileCount > 0 and
            .totalBytes > 0
          ' dist/Release/runtime-manifest.json >/dev/null

          plugin_count="$(jq -r '.pluginCount' dist/Release/runtime-manifest.json)"
          file_count="$(jq -r '.fileCount' dist/Release/runtime-manifest.json)"
          total_bytes="$(jq -r '.totalBytes' dist/Release/runtime-manifest.json)"
          total_mib="$(awk -v bytes="$total_bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')"

          if [[ ! -f artifacts/documentation.json ]]; then
            echo "::error::artifacts/documentation.json was not generated"
            exit 1
          fi

          if [[ ! -d docs/_site ]]; then
            echo "::error::docs/_site does not exist"
            exit 1
          fi

          docfx_file_count="$(find docs/_site -type f | wc -l)"

          if [[ "$docfx_file_count" -eq 0 ]]; then
            echo "::error::docs/_site is empty"
            exit 1
          fi

          {
            echo "## Release runtime"
            echo
            echo "- Plugins: $plugin_count"
            echo "- Files: $file_count"
            echo "- Size: $total_mib MiB"
            echo "- DocFX files: $docfx_file_count"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cs2-zombie-plague-${{ github.sha }}
          path: |
            dist/Release/packages/**
            dist/Release/runtime-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documentation-${{ github.sha }}
          path: |
            docs/_site/**
            artifacts/documentation.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: false
          include-hidden-files: false

      - name: Publish documentation to Flute CMS
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        shell: bash
        env:
          FLUTE_DOCUMENTATION_URL: ${{ secrets.FLUTE_DOCUMENTATION_URL }}
          FLUTE_DOCUMENTATION_TOKEN: ${{ secrets.FLUTE_DOCUMENTATION_TOKEN }}
        run: |
          if [[ -z "$FLUTE_DOCUMENTATION_URL" || -z "$FLUTE_DOCUMENTATION_TOKEN" ]]; then
            echo "::notice::Flute documentation publishing is not configured; the CI artifact is still available."
            exit 0
          fi

          checksum="$(sha256sum artifacts/documentation.json | cut -d ' ' -f 1)"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 60 \
            --request POST "$FLUTE_DOCUMENTATION_URL" \
            --header "Authorization: Bearer $FLUTE_DOCUMENTATION_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "X-Documentation-SHA256: $checksum" \
            --data-binary @artifacts/documentation.json
